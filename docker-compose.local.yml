services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ceecee
      POSTGRES_USER: ceecee
      POSTGRES_PASSWORD: local_only_change_me
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ceecee"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ceecee:local_only_change_me@db:5432/ceecee
      CEECEE_DRY_RUN: "1"
      CEECEE_OUTREACH_ENABLED: "0"
