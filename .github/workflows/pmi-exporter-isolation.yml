name: PMI bounded measured resource check
on:
  push:
    branches: [codex/exporter-interruption-isolation]
permissions:
  contents: read
jobs:
  measured:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install itsdangerous
      - name: Build isolated app and private disposable database
        run: |
          mkdir -p results
          docker build -f tests/Resource.Dockerfile -t pmi-resource .
          docker network create --internal pmi-resource-net
          docker run -d --name pmi-resource-db --network pmi-resource-net --memory 1g -e POSTGRES_USER=pmi_test -e POSTGRES_PASSWORD=disposable_test_only -e POSTGRES_DB=pmi_resource postgres:17
          for n in $(seq 1 30); do docker exec pmi-resource-db pg_isready -U pmi_test -d pmi_resource && break; sleep 1; done
      - name: Prepare exact measured synthetic fixture and unconstrained reference
        run: |
          docker run --rm --network pmi-resource-net --memory 2g --memory-swap 2g -v "$PWD/results:/results" -e DATABASE_URL=postgresql://pmi_test:disposable_test_only@pmi-resource-db:5432/pmi_resource pmi-resource python tests/resource_prepare.py --reference
      - name: Bounded full app and real multipart checks
        run: |
          for scenario in original-multipart original-export raised-cap-multipart; do
            mode=original; action=export
            if [ "$scenario" = original-multipart ]; then action=multipart; fi
            if [ "$scenario" = raised-cap-multipart ]; then mode=raised-cap; action=multipart; fi
            docker run --rm --network pmi-resource-net --memory 2g --memory-swap 2g -v "$PWD/results:/results" -e DATABASE_URL=postgresql://pmi_test:disposable_test_only@pmi-resource-db:5432/pmi_resource pmi-resource python tests/resource_prepare.py
            docker run -d --name pmi-resource-app --network pmi-resource-net --memory 512m --memory-swap 512m --cpus 1 -p 127.0.0.1:8080:8080 -v "$PWD/results:/results" -e RESOURCE_MODE="$mode" -e DATABASE_URL=postgresql://pmi_test:disposable_test_only@pmi-resource-db:5432/pmi_resource pmi-resource
            python tests/resource_driver.py results "$mode" "$action"
            docker logs pmi-resource-app > "results/log-$scenario.txt" 2>&1
            docker inspect pmi-resource-app --format '{{json .State}}' > "results/state-$scenario.json"
            docker rm -f pmi-resource-app
          done
          cat results/reference-report.json
          cat results/stages.jsonl
          cat results/log-*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-resource-results
          path: |
            results/*.json
            results/*.jsonl
            results/*.txt
