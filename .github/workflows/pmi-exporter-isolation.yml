name: PMI isolated complete backup repair
on:
  push:
    branches: [codex/exporter-interruption-isolation]
permissions:
  contents: read
jobs:
  measured:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install itsdangerous
      - name: Build isolated app and disposable databases
        run: |
          mkdir -p results
          docker build -f tests/Resource.Dockerfile -t pmi-resource .
          docker network create --internal pmi-resource-net
          docker run -d --name pmi-resource-db --network pmi-resource-net --memory 1g -e POSTGRES_USER=pmi_test -e POSTGRES_PASSWORD=disposable_test_only -e POSTGRES_DB=pmi_resource postgres:17
          for n in $(seq 1 30); do docker exec pmi-resource-db pg_isready -h 127.0.0.1 -U pmi_test -d pmi_resource && break; sleep 1; done
          docker exec pmi-resource-db createdb -U pmi_test pmi_export_synthetic
          docker exec pmi-resource-db createdb -U pmi_test pmi_restore_synthetic
      - name: Changed SQLite PostgreSQL restore and retry tests
        run: |
          docker run --rm --network container:pmi-resource-db --memory 512m --memory-swap 512m -e PMI_EXPORT_TEST_PG=1 pmi-resource python -m unittest test_backup_parts.PartsSQLite test_backup_parts.PartsPostgres -v
      - name: Measured fixture and original format reference
        run: |
          docker run --rm --network pmi-resource-net --memory 2g --memory-swap 2g -v "$PWD/results:/results" -e DATABASE_URL=postgresql://pmi_test:disposable_test_only@pmi-resource-db:5432/pmi_resource pmi-resource python tests/resource_prepare.py --reference
      - name: Full app upload readback restore and worker interruption under 512 MiB
        run: |
          for mode in parts parts-interrupt; do
            db=$(echo "$mode" | tr '-' '_')
            docker exec pmi-resource-db createdb -U pmi_test "restore_$db"
            docker run --rm --network pmi-resource-net --memory 2g --memory-swap 2g -v "$PWD/results:/results" -e DATABASE_URL=postgresql://pmi_test:disposable_test_only@pmi-resource-db:5432/pmi_resource pmi-resource python tests/resource_prepare.py
            docker run -d --name pmi-resource-app --network pmi-resource-net --memory 512m --memory-swap 512m --cpus 1 -v "$PWD/results:/results" -e RESOURCE_MODE="$mode" -e DATABASE_URL=postgresql://pmi_test:disposable_test_only@pmi-resource-db:5432/pmi_resource -e RESTORE_DATABASE_URL="postgresql://pmi_test:disposable_test_only@pmi-resource-db:5432/restore_$db" pmi-resource gunicorn --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:8080 parts_resource_app:app
            python tests/parts_resource_driver.py results "$mode" export
            docker logs pmi-resource-app > "results/log-$mode.txt" 2>&1
            docker inspect pmi-resource-app --format '{{json .State}}' > "results/state-$mode.json"
            docker run --rm --network pmi-resource-net --memory 2g --memory-swap 2g -v "$PWD/results:/results" -e DATABASE_URL=postgresql://pmi_test:disposable_test_only@pmi-resource-db:5432/pmi_resource pmi-resource python tests/resource_prepare.py --verify-after
            docker rm -f pmi-resource-app
          done
          cat results/stages.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-backup-resource-results
          path: |
            results/*.json
            results/*.jsonl
            results/*.txt

