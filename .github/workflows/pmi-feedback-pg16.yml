name: PMI disposable PostgreSQL 16 validation

on:
  push:
    branches: [codex/validate-pmi-feedback-pg16]

permissions:
  contents: read

jobs:
  feedback-postgres16:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmi_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: pmi_feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmi_test -d pmi_feedback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 187e24bb10ef553255f4c37039acfc1316aec795
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'Flask>=3.0,<4'
      - name: Require PostgreSQL 16 and nine passing checks with zero skips
        env:
          PYTHONPATH: .:tests
          PMI_TEST_POSTGRES_ISOLATED: '1'
          PMI_TEST_POSTGRES_DSN: postgresql://pmi_test:disposable_test_only@127.0.0.1:5432/pmi_feedback_test
        run: |
          python - <<'PY'
          import os
          import unittest
          import psycopg

          with psycopg.connect(os.environ['PMI_TEST_POSTGRES_DSN']) as connection:
              version = connection.info.server_version
              assert 160000 <= version < 170000, f'Expected PostgreSQL 16, got {version}'
              print(f'PostgreSQL server version: {version}')

          suite = unittest.defaultTestLoader.loadTestsFromName(
              'test_property_selection_feedback.SelectionLoopPostgreSQLTests')
          assert suite.countTestCases() == 9, 'Expected exactly nine PostgreSQL tests'
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = result.testsRun - len(result.failures) - len(result.errors) - len(result.skipped)
          print(f'PMI_POSTGRES_RESULT tests={result.testsRun} passed={passed} skipped={len(result.skipped)}')
          if not result.wasSuccessful() or result.testsRun != 9 or result.skipped:
              raise SystemExit(1)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('PMI commit 187e24bb10ef553255f4c37039acfc1316aec795: PostgreSQL 16, 9 passed, 0 skipped. Synthetic data only.\n')
          PY
